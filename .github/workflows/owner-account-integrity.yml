name: Owner Account Integrity
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  owner-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 bcrypt==4.1.3 pytest pytest-asyncio
      - name: Owner account and ownership history regressions
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_credential_inventory.py tests/test_owner_account_boundary.py tests/test_owner_deactivation_integrity.py tests/test_ownership_history.py
