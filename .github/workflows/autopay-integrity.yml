name: Autopay Integrity

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  autopay-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 pytest pytest-asyncio
      - name: Check confirmation, duplicate prevention and reconciliation trace
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_admin_autopay_run_confirmation.py
          tests/test_autopay_canonical_idempotency.py
          tests/test_autopay_reconciliation_trace.py
