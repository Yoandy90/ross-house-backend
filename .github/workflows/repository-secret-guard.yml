name: Repository Secret Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan tracked files without printing values
        run: python scripts/scan_repository_secrets.py
      - name: Run scanner tests
        run: python -m pip install --disable-pip-version-check pytest && python -m pytest -q tests/test_repository_secret_guard.py
