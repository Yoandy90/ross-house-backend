name: Runtime Security

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.py'
      - 'rental/runtime_secrets.py'
      - 'rental/shared.py'
      - 'rental/security.py'
      - 'tests/test_runtime_security.py'
      - '.github/workflows/runtime-security.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi==0.110.1 pymongo==4.6.1 PyJWT==2.10.1
      - name: Verify secrets and atomic rate limits
        run: python -m pytest -q tests/test_runtime_security.py
