name: Lease Renewal Main Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'rental/lease_renewal_*.py'
      - 'rental/auth_metrics.py'
      - 'tests/test_lease_renewal_*.py'
      - 'rental/staging_renewal_fixture_router.py'
      - 'scripts/staging_renewal_source_cycle.py'
      - 'tests/test_staging_renewal_fixture_router.py'
      - 'tests/test_staging_renewal_source_cycle.py'
      - '.github/workflows/staging-renewal-source-cycle.yml'
      - '.github/workflows/lease-renewal-main-integration.yml'

permissions:
  contents: read

concurrency:
  group: lease-renewal-main-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renewal-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 sendgrid==6.12.5 pytest pytest-asyncio
      - name: Compile complete renewal boundary
        run: python -m py_compile rental/lease_renewal_contract_generation_router.py rental/lease_renewal_delivery_recovery_router.py rental/lease_renewal_notification_security_router.py rental/lease_renewal_notification_sender.py rental/lease_renewal_rollover_recovery_router.py rental/lease_renewal_rollover_router.py rental/lease_renewal_security_router.py rental/lease_renewal_tenant_response_router.py rental/lease_renewal_workflow_status_router.py scripts/staging_renewal_source_cycle.py
      - name: Run complete renewal test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_lease_renewal_integrity.py tests/test_lease_renewal_notification_outbox.py tests/test_lease_renewal_notification_sender.py tests/test_lease_renewal_delivery_recovery.py tests/test_lease_renewal_tenant_response.py tests/test_lease_renewal_contract_generation.py tests/test_lease_renewal_rollover.py tests/test_lease_renewal_rollover_recovery.py tests/test_lease_renewal_workflow_status.py tests/test_staging_renewal_fixture_router.py tests/test_staging_renewal_source_cycle.py
