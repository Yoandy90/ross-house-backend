name: Lease Renewal Notification Sender

on:
  pull_request:
    branches: [phase/lease-renewal-notification-outbox]
    paths:
      - 'rental/lease_renewal_notification_sender.py'
      - 'rental/lease_renewal_notification_security_router.py'
      - 'rental/auth_metrics.py'
      - 'tests/test_lease_renewal_notification_sender.py'
      - '.github/workflows/lease-renewal-notification-sender.yml'

permissions:
  contents: read

concurrency:
  group: lease-renewal-notification-sender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 sendgrid==6.12.5 pytest pytest-asyncio
      - name: Compile sender boundary
        run: python -m py_compile rental/lease_renewal_notification_sender.py rental/lease_renewal_notification_security_router.py rental/auth_metrics.py
      - name: Run sender integrity tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_lease_renewal_notification_sender.py tests/test_lease_renewal_notification_outbox.py
