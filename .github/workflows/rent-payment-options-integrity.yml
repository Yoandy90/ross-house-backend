name: Rent Payment Options Integrity

on:
  pull_request:
    branches: [staging, main]
    paths:
      - rental/manual_confirmations_router.py
      - rental/payment_processors_router.py
      - rental/payment_processors_core.py
      - rental/rent_charge_policy.py
      - rental/rent_charge_claim.py
      - rental/rent_payment_cron.py
      - rental/tenant_dashboard_security_router.py
      - rental/tenant_invoices_router.py
      - tests/test_manual_confirmations.py
      - tests/test_hosted_checkout_idempotency.py
      - tests/test_hosted_rent_charge_wiring.py
      - tests/test_multi_month_rent.py
      - .github/workflows/rent-payment-options-integrity.yml

permissions:
  contents: read

jobs:
  payment-options-integrity:
    name: Canonical rent amount and payment options
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused production-compatible dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 reportlab==4.2.5 bcrypt==4.1.3 python-dotenv==1.0.1 python-multipart==0.0.20 pytest pytest-asyncio mongomock-motor
      - name: Compile payment modules
        run: python -m py_compile rental/manual_confirmations_router.py rental/payment_processors_router.py rental/payment_processors_core.py rental/rent_charge_policy.py rental/rent_charge_claim.py rental/rent_payment_cron.py rental/tenant_dashboard_security_router.py rental/tenant_invoices_router.py
      - name: Run rent payment option regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_manual_confirmations.py tests/test_hosted_checkout_idempotency.py tests/test_hosted_rent_charge_wiring.py tests/test_multi_month_rent.py tests/test_rent_charge_policy.py
