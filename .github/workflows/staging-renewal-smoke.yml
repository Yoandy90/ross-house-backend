name: Staging Renewal Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-renewal-smoke
  cancel-in-progress: false

jobs:
  renewal-smoke:
    name: Read-only renewal smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require protected staging configuration
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
        run: |
          test -n "$STAGING_BASE_URL" || { echo "STAGING_BASE_URL is not configured"; exit 1; }
          test -n "$STAGING_ADMIN_TOKEN" || { echo "STAGING_ADMIN_TOKEN is not configured"; exit 1; }
      - name: Run fail-closed renewal smoke
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
        run: python scripts/staging_renewal_smoke.py
      - name: Revoke temporary staging session
        if: ${{ always() }}
        continue-on-error: true
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
        run: |
          if [ -z "$STAGING_BASE_URL" ] || [ -z "$STAGING_ADMIN_TOKEN" ]; then
            exit 0
          fi
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen

          request = Request(
              os.environ["STAGING_BASE_URL"].rstrip("/") + "/api/auth/logout",
              data=b"{}",
              headers={
                  "Authorization": "Bearer " + os.environ["STAGING_ADMIN_TOKEN"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urlopen(request, timeout=10) as response:
              if response.status != 200:
                  raise RuntimeError("temporary session revocation failed")
          print("temporary staging session revoked")
          PY
