name: Signature Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  signature-authorization:
    name: Lease signature authorization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused production-compatible dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1
          PyJWT==2.10.1 httpx==0.27.0 pytest pytest-asyncio
      - name: Compile signature security modules
        run: python -m py_compile rental/lease_signature_security_router.py rental/signatures_router.py rental/dnc_registry_router.py
      - name: Run signature authorization regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_signature_authorization.py
