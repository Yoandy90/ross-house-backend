name: Account Deletion Integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  account-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.110.1 pymongo==4.6.1 PyJWT==2.10.1
      - run: python -m unittest discover -s tests -p test_account_deletion.py
