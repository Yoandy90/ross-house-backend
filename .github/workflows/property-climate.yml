name: Property climate integrity
on:
  pull_request:
    branches: [main]
    paths: ['rental/climate_*.py', 'tests/test_climate*.py', 'server.py', '.github/workflows/property-climate.yml']
permissions:
  contents: read
jobs:
  climate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 cryptography==46.0.2 AIOSomecomfort==0.0.38 pytest
      - run: python -m pytest tests/test_climate.py tests/test_climate_tcc.py tests/test_climate_monitor.py tests/test_tenant_identity_integrity.py -q
        env:
          PYTHONPATH: .
