name: Core Rental Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  occupancy-integrity:
    name: Property tenant lease occupancy integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused production-compatible dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 reportlab==4.2.5 pytest pytest-asyncio
      - name: Compile core rental modules
        run: python -m py_compile rental/units_router.py rental/unit_topology_security_router.py rental/property_mutation_lock.py rental/contracts_router.py rental/tenant_router.py rental/tenant_integrity.py rental/tenant_login_security_router.py rental/tenant_projection_security_router.py rental/tenant_dashboard_security_router.py rental/tenant_receipt_security_router.py rental/section8_security_router.py rental/maintenance_security_router.py rental/maintenance_ownership_security_router.py rental/maintenance_dispatch_security_router.py rental/inspection_security_router.py rental/inspection_delivery_router.py rental/inspection_delivery_worker.py rental/property_visibility_security_router.py rental/property_archival_security_router.py rental/property_lifecycle_security_router.py rental/admin_contract_mutation_security_router.py rental/lease_creation_security_router.py rental/lease_lifecycle_state_guard_router.py rental/lease_lifecycle_security_router.py rental/lease_lifecycle_recovery_router.py rental/listing_feed_router.py rental/property_sync_cron.py rental/auth_metrics.py rental/properties_router.py
      - name: Run core rental integrity tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_unit_occupancy_integrity.py tests/test_unit_topology_integrity.py tests/test_property_mutation_lock.py tests/test_property_sync_integrity.py tests/test_property_status_canonical_create.py tests/test_property_archival_integrity.py tests/test_archival_public_visibility_closure.py tests/test_tenant_identity_integrity.py tests/test_tenant_login_integrity.py tests/test_tenant_projection_integrity.py tests/test_tenant_dashboard_security.py tests/test_tenant_receipt_integrity.py tests/test_section8_identity_integrity.py tests/test_maintenance_tenant_integrity.py tests/test_maintenance_dispatch_integrity.py tests/test_inspection_lifecycle_integrity.py tests/test_inspection_delivery.py tests/test_inspection_delivery_worker.py tests/test_property_lifecycle_integrity.py tests/test_admin_contract_mutation_integrity.py tests/test_lease_creation_integrity.py tests/test_lease_lifecycle_integrity.py tests/test_lifecycle_force_activation_defense.py
