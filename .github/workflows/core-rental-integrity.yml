name: Core Rental Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  occupancy-integrity:
    name: Property tenant lease occupancy integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused production-compatible dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 pytest pytest-asyncio
      - name: Compile core rental modules
        run: python -m py_compile rental/units_router.py rental/contracts_router.py rental/tenant_router.py rental/properties_router.py
      - name: Run occupancy integrity tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_unit_occupancy_integrity.py
