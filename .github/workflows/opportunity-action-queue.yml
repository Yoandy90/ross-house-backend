name: Opportunity Action Queue

on:
  pull_request:
    paths:
      - 'rental/contact_enrichment_router.py'
      - 'rental/opportunity_action_queue.py'
      - 'tests/test_opportunity_action_queue.py'
      - '.github/workflows/opportunity-action-queue.yml'

permissions:
  contents: read

jobs:
  action-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 pytest pytest-asyncio
      - run: python -m py_compile rental/opportunity_action_queue.py rental/contact_enrichment_router.py
      - env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_opportunity_evidence_integrity.py tests/test_opportunity_evidence_queue.py tests/test_opportunity_action_queue.py
