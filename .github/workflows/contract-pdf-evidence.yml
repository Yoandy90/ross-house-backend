name: Contract PDF Evidence
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  contract-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 reportlab==4.2.5 bcrypt==4.1.3 python-dotenv==1.0.1 pytest pytest-asyncio pypdf pillow
      - run: python -m py_compile rental_pdf_service.py rental/contracts_router.py
      - run: python -m pytest -q tests/test_contract_pdf_evidence.py tests/test_legacy_signature_pdf.py tests/test_signature_authorization.py
        env:
          PYTHONPATH: .
