name: Deal Finder Response Read Model

on:
  pull_request:
    branches: [main]
    paths:
      - 'rental/deal_finder_router.py'
      - 'tests/test_deal_finder_response_read_model.py'
      - '.github/workflows/deal-finder-response-read-model.yml'

permissions:
  contents: read

jobs:
  response-read-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 pytest pytest-asyncio
      - name: Compile Deal Finder boundary
        run: python -m py_compile rental/deal_finder_router.py
      - name: Run response read-model tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_deal_finder_response_read_model.py
