name: Unsigned Active Contract Integrity

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'rental/contracts_router.py'
      - 'rental/lease_signature_security_router.py'
      - 'rental/lease_signature_state.py'
      - 'rental/signatures_router.py'
      - 'rental/tenant_integrity.py'
      - 'tests/test_signature_authorization.py'
      - 'tests/test_tenant_identity_integrity.py'
      - 'tests/test_unsigned_active_contract_state.py'
      - '.github/workflows/unsigned-active-contract-integrity.yml'
  push:
    branches: [staging, main]
    paths:
      - 'rental/contracts_router.py'
      - 'rental/lease_signature_security_router.py'
      - 'rental/lease_signature_state.py'
      - 'rental/signatures_router.py'
      - 'rental/tenant_integrity.py'
      - 'tests/test_signature_authorization.py'
      - 'tests/test_tenant_identity_integrity.py'
      - 'tests/test_unsigned_active_contract_state.py'
      - '.github/workflows/unsigned-active-contract-integrity.yml'

permissions:
  contents: read

jobs:
  lease-state-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1
          PyJWT==2.10.1 httpx==0.27.0 pytest pytest-asyncio
      - name: Compile contract state boundary
        run: >-
          python -m py_compile
          rental/lease_signature_state.py rental/tenant_integrity.py
          rental/contracts_router.py rental/lease_signature_security_router.py
          rental/signatures_router.py
      - name: Run unsigned active contract regressions
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_unsigned_active_contract_state.py
          tests/test_tenant_identity_integrity.py
          tests/test_signature_authorization.py
