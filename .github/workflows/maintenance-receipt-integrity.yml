name: Maintenance Receipt Integrity

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'rental/maintenance_security_router.py'
      - 'rental/security_email.py'
      - 'tests/test_maintenance_receipt_email.py'
      - '.github/workflows/maintenance-receipt-integrity.yml'
  push:
    branches: [staging, main]
    paths:
      - 'rental/maintenance_security_router.py'
      - 'rental/security_email.py'
      - 'tests/test_maintenance_receipt_email.py'
      - '.github/workflows/maintenance-receipt-integrity.yml'

permissions:
  contents: read

jobs:
  receipt-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check fastapi==0.110.1 pydantic==2.10.6 pymongo==4.6.1 PyJWT==2.10.1 httpx==0.27.0 bcrypt==4.1.3 python-dotenv==1.0.1 pytest pytest-asyncio
      - name: Compile maintenance receipt modules
        run: python -m py_compile rental/security_email.py rental/maintenance_security_router.py tests/test_maintenance_receipt_email.py
      - name: Run maintenance receipt tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_maintenance_receipt_email.py
