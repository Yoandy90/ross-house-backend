name: Staging Readiness Inspection

on:
  workflow_dispatch:
    inputs:
      deployed_commit:
        description: Railway deployed commit SHA
        required: true
        type: string
      variable_names_json:
        description: JSON array containing variable names only
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Names-only staging readiness gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build sanitized snapshot
        env:
          DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
          VARIABLE_NAMES_JSON: ${{ inputs.variable_names_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              names = json.loads(os.environ["VARIABLE_NAMES_JSON"])
          except json.JSONDecodeError:
              print("staging snapshot: FAIL (variable_names_json_invalid)")
              raise SystemExit(1)
          if not isinstance(names, list) or any(not isinstance(name, str) for name in names):
              print("staging snapshot: FAIL (variable_names_json_invalid)")
              raise SystemExit(1)

          snapshot = {
              "project_name": "Ross House",
              "environment_name": "staging",
              "service_name": "ross_house_staging",
              "source_repo": "Yoandy90/ross-house-backend",
              "source_branch": "main",
              "deployed_commit": os.environ["DEPLOYED_COMMIT"],
              "values_redacted": True,
              "variable_names": names,
          }
          Path("/tmp/ross-house-staging-snapshot.json").write_text(
              json.dumps(snapshot), encoding="utf-8"
          )
          PY
      - name: Validate staging readiness
        run: |
          python scripts/validate_staging_snapshot.py \
            /tmp/ross-house-staging-snapshot.json \
            --expected-commit "${{ github.sha }}"
